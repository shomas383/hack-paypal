# Render Blueprint — Landed (PayPal SANDBOX only). Field names per https://render.com/docs/blueprint-spec (read 2026-10-07).
# Plans: smallest paid tiers, kept through judging (Dec 15). Confirmed at Apply 2026-10-07 (Hobby workspace):
# web 0.5c-512mb (Starter, about $7/mo), Postgres 0.1c-256mb (about $6/mo).
databases:
  - name: landed-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17" # match local postgres:17.11-alpine (Render's default for new DBs is 18)
    databaseName: landed
    user: landed
    # No external access: the web service uses the internal connection string. Omitting this would allow all IPs
    # on a NEW database (blueprint-spec); 0.0.0.0/0 was removed in the dashboard on 2026-10-07.
    ipAllowList: []

services:
  - type: web
    name: landed
    runtime: node # Node 24 from package.json "engines"
    plan: 0.5c-512mb
    region: oregon
    branch: main
    # pnpm pinned to 10.32.1 via npx in every step. `corepack enable` fails on Render's build image (2026-10-07:
    # "EROFS: read-only file system, unlink '/usr/bin/pnpm'", Node 24.21.0), and the preinstalled pnpm is not our version.
    buildCommand: npx --yes pnpm@10.32.1 install --frozen-lockfile && npx --yes pnpm@10.32.1 build
    # Migrate + seed are idempotent; the seed aborts if any listing can't be quoted.
    preDeployCommand: npx --yes pnpm@10.32.1 db:migrate && npx --yes pnpm@10.32.1 db:seed
    startCommand: npx --yes pnpm@10.32.1 start # next start; honours Render's PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: landed-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox # boot fails unless sandbox (src/instrumentation.ts)
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID # inlined at build time: must be set before the first build
        sync: false
      - key: PAYPAL_WEBHOOK_ID # set after registering https://<render-url>/api/webhooks/paypal, then redeploy
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_EMAIL # the only invoice recipient in production
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SPEND_CAP_PER_ORDER_USD_MINOR
        sync: false
      - key: SPEND_CAP_PER_SESSION_USD_MINOR
        sync: false
      - key: QUOTE_TTL_SECONDS
        sync: false
      - key: CLASSIFIER_REVIEW_THRESHOLD
        sync: false
      - key: CLASSIFIER_LIMIT_PER_SESSION_PER_HOUR
        sync: false
      - key: CLASSIFIER_LIMIT_PER_IP_PER_HOUR
        sync: false
      - key: CLASSIFIER_DAILY_CEILING
        sync: false
      - key: AGENT_LIMIT_PER_SESSION_PER_HOUR # buyer-agent runs per session per hour (IP: 2x)
        value: "5"
      - key: AGENT_DAILY_CEILING # buyer-agent runs per UTC day (60 from submission until winners are announced, Dec 21)
        value: "60"
      - key: ESTIMATE_LIMIT_PER_SESSION_PER_HOUR # public /estimate per session per hour; set in the dashboard (judging: 8)
        sync: false
      - key: ESTIMATE_LIMIT_PER_IP_PER_HOUR # public /estimate per client IP per hour; set in the dashboard (judging: 16)
        sync: false
      - key: ESTIMATE_DAILY_CEILING # public /estimates per UTC day, global; set in the dashboard (judging: 150)
        sync: false
      - key: SELLER_CONSOLE_PASSCODE # /seller passcode (>= 12 chars); set in the dashboard; unset = console disabled (404)
        sync: false
      - key: SELLER_PUBLIC_VIEW # 1 = public read-only /seller/demo; set in the dashboard; unset or 0 = off (404)
        sync: false
      - key: PUBLIC_BASE_URL # public https origin; required in production (boot refuses without it). Not a secret.
        value: https://landed-hd19.onrender.com
      - key: TRUSTED_PROXY_HOPS # Render: one Cloudflare edge hop appended after the client (verified 2026-10-07)
        value: "1"
      # DEBUG_CLIENT_IP=1 only temporarily for the client-IP check after the first deploy; then remove it.
      # PAYPAL_SANDBOX_BUYER_PASSWORD is deliberately NOT set here (local e2e only).
